[project]
name = "torque-diagnostics"
version = "0.1.0"
description = "Technician assistant for ABB drive manuals."
readme = "README.md"
requires-python = ">=3.11"
# uv sync installs this list into .venv. uv.lock pins the exact versions.
dependencies = [
    "boto3>=1.34",
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=15",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=1.0",
]

[tool.uv]
package = false
